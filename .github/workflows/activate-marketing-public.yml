name: Activate BrinqueTEAndo marketing public route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-marketing-public.yml"

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute activation phases
        shell: bash
        run: |
          set +e
          TOKEN=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('.github/workflows/activate-marketing.yml').read_text()
          match = re.search(r'SETUP_TOKEN:\s*"([^"]+)"', text)
          print(match.group(1) if match else '')
          PY
          )
          BASE='https://www.brinqueteando.online/api/setup-marketing-7f3a9c'
          rm -rf marketing-activation
          mkdir -p marketing-activation

          run_phase() {
            phase="$1"
            response=$(curl --retry 2 --retry-delay 3 --silent --show-error --write-out '\n%{http_code}' "$BASE?token=$TOKEN&phase=$phase")
            code=$(printf '%s\n' "$response" | tail -n 1)
            body=$(printf '%s\n' "$response" | sed '$d')
            printf '%s\n' "$body" > "marketing-activation/$phase.json"
            printf '%s\n' "$code" > "marketing-activation/$phase.status"
          }

          run_phase templates1
          run_phase templates2
          run_phase templates3
          run_phase templates4
          run_phase automations
          run_phase stripe

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('marketing-activation')
          phases = ['templates1','templates2','templates3','templates4','automations','stripe']
          report = {}
          for phase in phases:
              status = (root / f'{phase}.status').read_text().strip()
              raw = (root / f'{phase}.json').read_text().strip()
              try:
                  body = json.loads(raw) if raw else None
              except Exception:
                  body = {'raw': raw[:3000]}
              report[phase] = {'http_status': status, 'response': body}
          (root / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit activation report
        shell: bash
        run: |
          git config user.name "BrinqueTEAndo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add marketing-activation/report.json
          git commit -m "chore: registra ativação final de marketing" || exit 0
          git push
