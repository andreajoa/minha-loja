name: Reconcile Store Manager Once

on:
  push:
    branches:
      - store-manager/publication-contract-v1-current

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: store-manager/publication-contract-v1-current

      - name: Fetch validated previous branch
        run: git fetch origin store-manager/publication-contract-v1:refs/remotes/origin/store-manager/publication-contract-v1

      - name: Copy unchanged integration files
        run: |
          git show origin/store-manager/publication-contract-v1:src/data/products.ts > src/data/products.ts
          git show origin/store-manager/publication-contract-v1:src/app/carrinho/page.tsx > src/app/carrinho/page.tsx
          git show origin/store-manager/publication-contract-v1:src/components/EmbeddedCheckoutExperience.tsx > src/components/EmbeddedCheckoutExperience.tsx

      - name: Remove temporary reconciliation files
        run: |
          rm -f src/data/store-catalog.ts
          rm -f .github/workflows/reconcile-store-manager-once.yml

      - name: Commit reconciled branch
        run: |
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: reconcile Store Manager integration with current main"
          git push origin HEAD:store-manager/publication-contract-v1-current
