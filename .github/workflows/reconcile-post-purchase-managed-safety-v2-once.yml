name: Restore managed post-purchase safety v2 once

on:
  push:
    branches:
      - store-manager/checkout-stock-reservation
    paths:
      - .github/workflows/reconcile-post-purchase-managed-safety-v2-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: store-manager/checkout-stock-reservation
      - name: Restore fail-closed post-purchase filter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/api/post-purchase/route.ts')
          t=p.read_text()
          old='''import { BASE_PATH } from "@/lib/paths";'''
          new='''import { BASE_PATH } from "@/lib/paths";\nimport { isUnsafeAutomaticPostPurchaseProduct } from "@/lib/store-manager-post-purchase";'''
          assert old in t
          t=t.replace(old,new,1)
          old='''  const product = products.find((item) => item.id === productId);\n  if (!product) throw new Error("Produto da oferta não encontrado.");'''
          new='''  const product = products.find((item) => item.id === productId);\n  if (!product || isUnsafeAutomaticPostPurchaseProduct(product.id)) {\n    throw new Error("Produto da oferta não está disponível neste fluxo pós-compra.");\n  }'''
          assert old in t
          t=t.replace(old,new,1)
          old='''    const recommendations = getPostPurchaseRecommendations(purchasedIds, 4);\n    const offerProduct = recommendations[0] || null;'''
          new='''    const recommendations = getPostPurchaseRecommendations(purchasedIds, 8)\n      .filter((product) => !isUnsafeAutomaticPostPurchaseProduct(product.id))\n      .slice(0, 4);\n    const recommendedProductCandidate = recommendations[0] || null;\n    const offerProduct = recommendedProductCandidate;'''
          assert old in t
          t=t.replace(old,new,1)
          old='''    const product = products.find((item) => item.id === payload.productId);\n    if (!product || product.stock <= 0) {'''
          new='''    const product = products.find((item) => item.id === payload.productId);\n    if (!product || isUnsafeAutomaticPostPurchaseProduct(product.id) || product.stock <= 0) {'''
          assert old in t
          p.write_text(t.replace(old,new,1))
          PY
      - name: Validate and commit
        run: |
          grep -Fq 'isUnsafeAutomaticPostPurchaseProduct' src/app/api/post-purchase/route.ts
          grep -Fq 'recommendedProductCandidate' src/app/api/post-purchase/route.ts
          rm .github/workflows/reconcile-post-purchase-managed-safety-v2-once.yml
          git config user.name "store-manager-bot"
          git config user.email "store-manager-bot@users.noreply.github.com"
          git add src/app/api/post-purchase/route.ts .github/workflows/reconcile-post-purchase-managed-safety-v2-once.yml
          git commit -m "fix: keep managed products out of legacy post-purchase payments"
          git push origin HEAD:store-manager/checkout-stock-reservation
