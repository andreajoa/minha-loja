name: Install analytics database dependency

on:
  push:
    branches: [analytics-dashboard-system]
    paths:
      - ".github/workflows/install-analytics-dependency.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-dashboard-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Neon serverless driver
        run: npm install @neondatabase/serverless@1.1.0 --save
      - name: Commit package files
        run: |
          git config user.name "BrinqueTEAndo Analytics"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: adiciona Neon serverless para analytics" || exit 0
          git push origin HEAD:analytics-dashboard-system
