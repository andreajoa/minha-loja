name: Finalizar catálogo local

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalizar-catalogo-local.yml]

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Salvar imagens geradas da homepage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/homepage-images-direct:refs/remotes/origin/fix/homepage-images-direct
          git show origin/fix/homepage-images-direct:assets/home-images.tar.gz > /tmp/home-images.tar.gz
          rm -rf public/home-images
          mkdir -p public/home-images
          tar -xzf /tmp/home-images.tar.gz -C public/home-images
          cp public/home-images/atalho-categoria-sensorial.webp public/home-images/categoria-sensorial.webp
          cp public/home-images/atalho-categoria-comunicacao.webp public/home-images/categoria-comunicacao.webp
          cp public/home-images/atalho-categoria-motor.webp public/home-images/categoria-motor.webp
          cp public/home-images/atalho-categoria-autonomia.webp public/home-images/categoria-rotina.webp
          cp public/home-images/galeria-familia-sensorial.webp public/home-images/galeria-nova-sensorial.webp
          cp public/home-images/galeria-familia-rotina.webp public/home-images/galeria-nova-rotina.webp
          cp public/home-images/galeria-familia-exploracao.webp public/home-images/galeria-nova-motor.webp
          cp public/home-images/galeria-familia-comunicacao.webp public/home-images/galeria-nova-comunicacao.webp
          test -s public/home-images/curadoria-com-proposito.webp
      - name: Salvar fotografias dos produtos no projeto
        shell: bash
        env:
          MANIFEST_GZ_B64: ''
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from io import BytesIO
          from pathlib import Path
          import base64, gzip, os, shutil, time, urllib.request
          import pillow_avif
          from PIL import Image, ImageOps
          rows = gzip.decompress(base64.b64decode(os.environ['MANIFEST_GZ_B64'])).decode().splitlines()
          entries = [line.split('\t', 2) for line in rows if line.strip()]
          root = Path('public/products/shopify')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True, exist_ok=True)
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent', 'Mozilla/5.0 BrinqueTEAndo catalog importer')]
          for position, (product_id, index, url) in enumerate(entries, 1):
              destination = root / product_id / f'{int(index):02d}.webp'
              destination.parent.mkdir(parents=True, exist_ok=True)
              for attempt in range(4):
                  try:
                      with opener.open(url, timeout=45) as response:
                          data = response.read()
                      image = Image.open(BytesIO(data))
                      image = ImageOps.exif_transpose(image).convert('RGB')
                      image.save(destination, 'WEBP', quality=86, method=6)
                      print(f'[{position}/{len(entries)}] {destination}')
                      break
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(2 * (attempt + 1))
          files = list(root.rglob('*.webp'))
          if len(files) != 101:
              raise RuntimeError(f'Esperadas 101 imagens; encontradas {len(files)}')
          PYCODE
      - name: Registrar arquivos definitivos
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalizar-catalogo-local.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Conclui homepage interna e catálogo independente"
          git push origin HEAD:main
