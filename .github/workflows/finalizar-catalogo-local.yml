name: Aplicar imagens geradas da homepage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalizar-catalogo-local.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar a branch principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materializar somente as imagens geradas
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/homepage-images-direct:refs/remotes/origin/fix/homepage-images-direct

          git show origin/fix/homepage-images-direct:assets/home-images.tar.gz > /tmp/home-images.tar.gz
          rm -rf public/home-images
          mkdir -p public/home-images
          tar -xzf /tmp/home-images.tar.gz -C public/home-images

          : > /tmp/storefront.b64
          for part in 00 01 02 03 04 05 06 07; do
            git show "origin/fix/homepage-images-direct:assets/storefront-${part}.b64" >> /tmp/storefront.b64
          done
          tr -d '\r\n' < /tmp/storefront.b64 | base64 --decode > src/components/StorefrontHome.tsx

          test -s public/home-images/atalho-categoria-sensorial.webp
          test -s public/home-images/atalho-categoria-comunicacao.webp
          test -s public/home-images/atalho-categoria-cognitivo.webp
          test -s public/home-images/atalho-categoria-autonomia.webp
          test -s public/home-images/atalho-categoria-motor.webp
          test -s public/home-images/atalho-categoria-criatividade.webp
          test -s public/home-images/curadoria-com-proposito.webp
          test -s public/home-images/colecao-sensorial.webp
          test -s public/home-images/colecao-comunicacao.webp
          test -s public/home-images/colecao-motor.webp
          test -s public/home-images/colecao-autonomia.webp
          test -s public/home-images/galeria-familia-sensorial.webp
          test -s public/home-images/galeria-familia-rotina.webp
          test -s public/home-images/galeria-familia-comunicacao.webp
          test -s public/home-images/galeria-familia-exploracao.webp
          grep -q '/home-images/curadoria-com-proposito.webp' src/components/StorefrontHome.tsx
          grep -q '/home-images/colecao-sensorial.webp' src/components/StorefrontHome.tsx
          grep -q '/home-images/galeria-familia-sensorial.webp' src/components/StorefrontHome.tsx

      - name: Salvar os arquivos definitivos
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalizar-catalogo-local.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige imagens geradas das seções internas"
          git push origin HEAD:main
