name: Validate analytics dashboard build

on:
  push:
    branches: [analytics-dashboard-system]
    paths:
      - ".github/workflows/validate-analytics-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-dashboard-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and write report
        shell: bash
        run: |
          set +e
          npm run build > analytics-build.log 2>&1
          STATUS=$?
          {
            echo "exit_code=$STATUS"
            echo "--- build tail ---"
            tail -n 240 analytics-build.log
          } > analytics-build-report.txt
          git config user.name "BrinqueTEAndo Analytics"
          git config user.email "actions@users.noreply.github.com"
          git add analytics-build-report.txt
          git commit -m "chore: registra validação do analytics" || true
          git push origin HEAD:analytics-dashboard-system
          exit $STATUS
