name: Store Manager Checkout Reservation CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/checkout/route.ts'
      - 'src/lib/store-manager-reservations.ts'
      - 'src/lib/store-manager-orders.ts'
      - '.github/workflows/store-manager-checkout-reservation-ci.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract wiring
        run: |
          grep -Fq 'STORE_MANAGER_RESERVATION_URL' src/lib/store-manager-reservations.ts
          grep -Fq 'store_manager_reservation_id' src/app/api/checkout/route.ts
          grep -Fq 'reservationId' src/lib/store-manager-orders.ts
          grep -Fq '["US", "CA", "GB", "AU", "NZ"]' src/app/api/checkout/route.ts
          grep -Fq 'releaseManagedCheckoutReservation' src/app/api/checkout/route.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
