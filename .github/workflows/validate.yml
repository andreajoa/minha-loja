name: Validate production build

on:
  pull_request:
  push:
    branches:
      - agent/brinqueteando-production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: https://www.adhdautism.online/brinqueteando
      NEXT_PUBLIC_BASE_PATH: /brinqueteando
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cG9wdWxhci1mcm9nLTkxLmNsZXJrLmFjY291bnRzLmRldiQ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
