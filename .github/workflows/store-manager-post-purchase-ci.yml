name: Store Manager Post Purchase CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify variant safety wiring
        run: |
          grep -Fq 'isUnsafeAutomaticPostPurchaseProduct' src/app/api/post-purchase/route.ts
          grep -Fq 'recommendedProductCandidate' src/app/api/post-purchase/route.ts
      - run: npx tsc --noEmit
      - run: npm run build
