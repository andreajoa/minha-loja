name: Activate BrinqueTEAndo marketing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-marketing.yml"

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SETUP_TOKEN: "4xQZ1p-hgGCpCLguXYjZP-bQ2RNaJ1Gu"
      SETUP_URL: "https://www.brinqueteando.online/api/_setup-marketing-7f3a9c"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for production
        run: sleep 5

      - name: Execute activation phases
        shell: bash
        run: |
          set +e
          rm -rf marketing-activation
          mkdir -p marketing-activation

          run_phase() {
            phase="$1"
            echo "Running $phase"
            response=$(curl --retry 2 --retry-delay 2 --silent --show-error \
              --write-out '\n%{http_code}' \
              "$SETUP_URL?token=$SETUP_TOKEN&phase=$phase")
            code=$(printf '%s\n' "$response" | tail -n 1)
            body=$(printf '%s\n' "$response" | sed '$d')
            printf '%s\n' "$body" > "marketing-activation/$phase.json"
            printf '%s\n' "$code" > "marketing-activation/$phase.status"
          }

          run_phase templates1
          run_phase templates2
          run_phase templates3
          run_phase templates4
          run_phase automations
          run_phase stripe

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('marketing-activation')
          phases = ['templates1','templates2','templates3','templates4','automations','stripe']
          report = {}
          for phase in phases:
              status = (root / f'{phase}.status').read_text().strip()
              raw = (root / f'{phase}.json').read_text().strip()
              try:
                  body = json.loads(raw) if raw else None
              except Exception:
                  body = {'raw': raw}
              report[phase] = {'http_status': status, 'response': body}
          (root / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit activation report
        shell: bash
        run: |
          git config user.name "BrinqueTEAndo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add marketing-activation/report.json
          git commit -m "chore: registra resultado da ativação de marketing" || exit 0
          git push
