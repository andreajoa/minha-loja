name: Restaurar imagens dos produtos em alta resolução

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restaurar-imagens-produtos-hq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restaurar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar a branch da correção
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Encerrar quando a restauração já estiver pronta
        id: readiness
        shell: bash
        run: |
          if [ -f tools/product-images-hq.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Python
        if: steps.readiness.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar processador de imagens
        if: steps.readiness.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin

      - name: Restaurar as 101 imagens em alta resolução
        if: steps.readiness.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          import json
          import shutil
          import time
          import urllib.request

          import pillow_avif
          from PIL import Image, ImageFilter, ImageOps

          manifest = json.loads(Path("tools/product-images-hq.json").read_text(encoding="utf-8"))
          if len(manifest) != 101:
              raise RuntimeError(f"Esperadas 101 imagens no manifesto; encontradas {len(manifest)}")

          root = Path("public/products/catalog")
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir(parents=True, exist_ok=True)

          opener = urllib.request.build_opener()
          opener.addheaders = [
              ("User-Agent", "Mozilla/5.0 BrinqueTEAndo high-resolution importer"),
              ("Accept", "image/avif,image/webp,image/png,image/jpeg,*/*"),
          ]

          for position, item in enumerate(manifest, 1):
              destination = Path(item["path"])
              destination.parent.mkdir(parents=True, exist_ok=True)

              for attempt in range(5):
                  try:
                      with opener.open(item["url"], timeout=60) as response:
                          data = response.read()

                      image = Image.open(BytesIO(data))
                      image = ImageOps.exif_transpose(image)
                      width, height = image.size
                      largest_side = max(width, height)

                      if largest_side > 1600:
                          scale = 1600 / largest_side
                          image = image.resize(
                              (round(width * scale), round(height * scale)),
                              Image.Resampling.LANCZOS,
                          )
                      elif largest_side < 1000:
                          scale = 1000 / largest_side
                          image = image.resize(
                              (round(width * scale), round(height * scale)),
                              Image.Resampling.LANCZOS,
                          )
                          image = image.filter(
                              ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=3)
                          )

                      image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                      image.save(destination, "WEBP", quality=92, method=6)
                      print(
                          f"[{position:03d}/{len(manifest)}] {destination} "
                          f"{image.size[0]}x{image.size[1]} "
                          f"{destination.stat().st_size / 1024:.1f} KB"
                      )
                      break
                  except Exception:
                      if attempt == 4:
                          raise
                      time.sleep(2 * (attempt + 1))

          files = sorted(root.rglob("*.webp"))
          primary_images = sorted(root.glob("*/01.webp"))

          if len(files) != 101:
              raise RuntimeError(f"Esperadas 101 imagens; encontradas {len(files)}")
          if len(primary_images) != 23:
              raise RuntimeError(f"Esperadas 23 imagens principais; encontradas {len(primary_images)}")

          for file in files:
              with Image.open(file) as image:
                  if max(image.size) < 1000:
                      raise RuntimeError(f"Imagem abaixo de 1000 px: {file} {image.size}")

          total_size = sum(file.stat().st_size for file in files)
          print(f"Catálogo concluído: 101 imagens, {total_size / 1024 / 1024:.2f} MB")
          PY

      - name: Registrar as imagens definitivas na branch
        if: steps.readiness.outputs.run == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -f tools/product-images-hq.json
          rm -f .github/workflows/restaurar-imagens-produtos-hq.yml
          rm -f docs/disparar-restauracao-imagens-hq.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restaura imagens dos produtos em alta resolução"
          git push origin "HEAD:${TARGET_BRANCH}"
