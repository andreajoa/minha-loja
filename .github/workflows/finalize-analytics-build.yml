name: Finalize analytics dashboard build

on:
  push:
    branches: [analytics-dashboard-system]
    paths:
      - ".github/workflows/finalize-analytics-build.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics-dashboard-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build > analytics-build.log 2>&1
          STATUS=$?
          {
            echo "exit_code=$STATUS"
            echo "--- build tail ---"
            tail -n 260 analytics-build.log
          } > analytics-build-report.txt
          git config user.name "BrinqueTEAndo Analytics"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json analytics-build-report.txt
          git commit -m "chore: finaliza lock e build do analytics" || true
          git push origin HEAD:analytics-dashboard-system
          exit $STATUS
